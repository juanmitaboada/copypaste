<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="160" height="160" role="img" aria-label="OnlineCopyPaste">
  <style>
    .arms path { fill: none; stroke: #8f5bd6; stroke-width: 7; stroke-linecap: round; }
    @media (prefers-reduced-motion: no-preference) {
      .body { animation: bob 3s ease-in-out infinite; }
      .arms path { transform-box: fill-box; transform-origin: 50% 0; animation: wave 1.1s ease-in-out infinite alternate; }
      .arms path:nth-child(2) { animation-delay: -0.3s; }
      .arms path:nth-child(3) { animation-delay: -0.6s; }
      .arms path:nth-child(4) { animation-delay: -0.9s; }
    }
    @keyframes wave { from { transform: rotate(12deg); } to { transform: rotate(-12deg); } }
    @keyframes bob { 50% { transform: translateY(-4px); } }
  </style>
  <g class="body">
    <g class="arms"><path d="M28 58q-6 14-2 26"/><path d="M42 62q-2 14-6 26"/><path d="M58 62q2 14 6 26"/><path d="M72 58q6 14 2 26"/></g>
    <path d="M20 60C20 18 80 18 80 60Z" fill="#a974ee"/>
    <circle cx="40" cy="44" r="6" fill="#fff"/><circle cx="60" cy="44" r="6" fill="#fff"/>
    <circle cx="41" cy="45" r="3" fill="#24123d"/><circle cx="61" cy="45" r="3" fill="#24123d"/>
    <circle cx="32" cy="54" r="3" fill="#f3a1c9"/><circle cx="68" cy="54" r="3" fill="#f3a1c9"/>
  </g>
</svg>
