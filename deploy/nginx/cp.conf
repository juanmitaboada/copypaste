# cp: self-hosted notepad. Rendered per instance (@NAME@, @DOMAIN@, @ROOT@ replaced).
# @NAME@ prefixes everything global to nginx (zones, map variable, snippet, logs)
# so several cp instances can coexist.
# Only the locations below reach PHP, and all of them run one fixed script
# (snippets/@NAME@-fastcgi.conf); nothing under the web root is ever executed.

# Rate-limit key: the IPv4 address, or the /64 prefix for IPv6 (one host usually
# owns a whole /64, so per-address limits would be trivial to rotate around).
# Written-out /64s only; addresses compressed inside the first 64 bits ("::")
# fall back to the full address.
map $remote_addr $@NAME@_client {
    "~^([0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}:[0-9a-f]{1,4}):" $1;
    default $remote_addr;
}
limit_req_zone $@NAME@_client zone=@NAME@_req:10m rate=5r/s;

# Password attempts get their own, much stricter budget. Requests without
# ?a=unlock map to an empty key, which limit_req does not count. PHP rejects any
# query where its idea of "a" could differ from nginx's $arg_a (see App::action).
map $arg_a $@NAME@_unlock_key {
    default "";
    unlock  $@NAME@_client;
}
limit_req_zone $@NAME@_unlock_key zone=@NAME@_unlock:10m rate=6r/m;

# Live-update polls (every 3 s per open tab) stay out of the access log: only the
# exact GET app.js sends, and only when it succeeded, so nothing else (writes,
# 401/403/404 probing) can hide behind "a=poll". Used by the note locations only.
map "$request_method:$args:$status" $@NAME@_loggable {
    default                        1;
    "~^GET:a=poll:(200|204)$"      0;
}

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name @DOMAIN@;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/@DOMAIN@/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem;

    root @ROOT@/app/public;
    access_log /var/log/nginx/@NAME@.access.log;
    error_log  /var/log/nginx/@NAME@.error.log;

    # 256 KiB note limit (enforced again in PHP) plus form-encoding overhead.
    client_max_body_size 400k;
    limit_req zone=@NAME@_req burst=30 nodelay;
    limit_req zone=@NAME@_unlock burst=3 nodelay;
    limit_req_status 429;

    # No add_header inside locations below: that would silently drop these.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Note URLs are secrets-by-obscurity: never send them to other sites in Referer.
    # Not "no-referrer": that turns same-origin form POSTs into "Origin: null".
    add_header Referrer-Policy "same-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = / {
        fastcgi_param CP_ROUTE home;
        include snippets/@NAME@-fastcgi.conf;
    }

    location = /go {
        fastcgi_param CP_ROUTE go;
        include snippets/@NAME@-fastcgi.conf;
    }

    location = /new {
        auth_basic "cp";
        auth_basic_user_file @ROOT@/etc/htpasswd;
        fastcgi_param CP_ROUTE new;
        include snippets/@NAME@-fastcgi.conf;
    }

    # Regexes are quoted: an unquoted '{3,32}' would be parsed as a block.
    location ~ "^/new/(?<cp_code>[a-z0-9_-]{3,32})$" {
        auth_basic "cp";
        auth_basic_user_file @ROOT@/etc/htpasswd;
        fastcgi_param CP_ROUTE admin;
        fastcgi_param CP_ZONE public;
        fastcgi_param CP_CODE $cp_code;
        include snippets/@NAME@-fastcgi.conf;
    }

    location ~ "^/new/private/(?<cp_code>[a-z0-9_-]{3,32})$" {
        auth_basic "cp";
        auth_basic_user_file @ROOT@/etc/htpasswd;
        fastcgi_param CP_ROUTE admin;
        fastcgi_param CP_ZONE private;
        fastcgi_param CP_CODE $cp_code;
        include snippets/@NAME@-fastcgi.conf;
    }

    location ~ "^/private/(?<cp_code>[a-z0-9_-]{3,32})$" {
        auth_basic "cp";
        auth_basic_user_file @ROOT@/etc/htpasswd;
        access_log /var/log/nginx/@NAME@.access.log combined if=$@NAME@_loggable;
        fastcgi_param CP_ROUTE note;
        fastcgi_param CP_ZONE private;
        fastcgi_param CP_CODE $cp_code;
        include snippets/@NAME@-fastcgi.conf;
    }

    location ~ "^/(?<cp_code>[a-z0-9_-]{3,32})$" {
        access_log /var/log/nginx/@NAME@.access.log combined if=$@NAME@_loggable;
        fastcgi_param CP_ROUTE note;
        fastcgi_param CP_ZONE public;
        fastcgi_param CP_CODE $cp_code;
        include snippets/@NAME@-fastcgi.conf;
    }

    location ^~ /static/ {
        try_files $uri =404;
        expires 1h;
    }

    location / {
        return 404;
    }
}
