; cp: dedicated php-fpm pool. Rendered per instance (@NAME@, @USER@, @GROUP@, @ROOT@, @SOCKET@, @WEBGROUP@ replaced).
; Separate user + open_basedir: a bug in cp cannot read other sites' files.
[@NAME@]
user = @USER@
group = @GROUP@
listen = @SOCKET@
listen.owner = root
listen.group = @WEBGROUP@
listen.mode = 0660

pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 60s
pm.max_requests = 500
request_terminate_timeout = 15s

clear_env = yes
security.limit_extensions = .php
catch_workers_output = yes

php_admin_value[open_basedir] = @ROOT@/app/:@ROOT@/data/:@ROOT@/etc/secret:@ROOT@/etc/theme
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,putenv,mail,symlink,link,fsockopen,pfsockopen,stream_socket_client,stream_socket_server,curl_init,curl_exec,curl_multi_exec,ftp_connect,ftp_ssl_connect,posix_kill,posix_setuid,posix_setgid,posix_setpgid,posix_setsid,posix_mkfifo,proc_nice,proc_terminate,imap_open,mb_send_mail
php_admin_flag[allow_url_fopen] = off
php_admin_flag[allow_url_include] = off
php_admin_flag[file_uploads] = off
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
; Matches nginx client_max_body_size.
php_admin_value[post_max_size] = 400K
php_admin_value[max_input_vars] = 50
php_admin_value[memory_limit] = 32M
php_admin_value[max_execution_time] = 10
php_admin_flag[session.auto_start] = off
